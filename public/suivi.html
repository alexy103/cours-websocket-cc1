<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Suivi de commande</title>
	</head>
	<body>
		<a href="/">Retourner à l'accueil</a>
		<h1 id="title">Commande</h1>
		<p>Statut : <strong id="status">chargement…</strong></p>

		<script>
			const orderId = new URLSearchParams(window.location.search).get('id');
			document.getElementById('title').textContent = `Commande #${orderId}`;

			function showStatus(order) {
				document.getElementById('status').textContent = order.status;
			}

			async function loadOrder() {
				const res = await fetch(`/api/orders/${orderId}`);
				if (!res.ok) {
					document.getElementById('status').textContent = 'commande introuvable';
					return;
				}
				showStatus(await res.json());
			}

			loadOrder();

			const source = new EventSource(`/api/orders/${orderId}/stream`);
			source.addEventListener('order-status-updated', (e) => showStatus(JSON.parse(e.data)));
			source.addEventListener('order-cancelled', (e) => showStatus(JSON.parse(e.data)));
		</script>
	</body>
</html>
